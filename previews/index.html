<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>移動モーション</title>
<style>body{margin:24px;background:#fafaf8;color:#444;font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:18px;font-weight:500;margin:0}select,button,input{font:inherit}select,button{padding:5px;background:white;border:1px solid #ccc}#gif{width:320px;height:400px;display:block;margin:16px 0}.strip{overflow-x:auto;border-bottom:1px solid #ddd;margin:16px 0;padding-bottom:8px}.strip img{max-width:none;display:block;height:300px}label{display:inline-flex;align-items:center;gap:6px}p{max-width:850px;line-height:1.7}a{color:#555}#status{font-size:12px;color:#777}</style>
<header><h1>移動モーション</h1><select id="motion"><option>Idle</option><option>Walk</option><option>Jog</option><option>StartWalkL</option><option>StopWalkL</option><option>StartWalkR</option><option>StopWalkR</option><option>StartJogL</option><option>StopJogL</option><option>StartJogR</option><option>StopJogR</option><option>Turn90L</option><option>Turn90R</option><option>Turn180L</option><option>Turn180R</option></select><select id="view"><option value="side">側面</option><option value="front">正面</option><option value="three_quarter">斜め</option></select><button id="restart">先頭から</button><a id="download" download>GIF</a></header>
<img id="gif" alt="モーションGIF"><p id="status"></p><label>連続画像の倍率 <input id="zoom" type="range" min="50" max="200" value="100" step="10"><output id="zoomvalue">100%</output></label>
<div id="strips"></div><p>1周期は同じ足の接地から次の同じ足の接地まで。連続画像は0〜100%を32分割し、両端の姿勢を含みます。GIFはActionを25Hzで直接描画した画像です。発進・停止・旋回には空白のリセット区間があります。<a href="../README.ja.md">日本語ガイド</a></p>
<script>const motion=document.querySelector('#motion'),view=document.querySelector('#view'),gif=document.querySelector('#gif'),zoom=document.querySelector('#zoom');function scale(){document.querySelectorAll('.strip img').forEach(i=>i.style.height=(300*zoom.value/100)+'px');document.querySelector('#zoomvalue').value=zoom.value+'%'}function show(){let n=motion.value,v=view.value;gif.src='gifs/'+n+'_'+v+'.gif';document.querySelector('#download').href=gif.src;document.querySelector('#strips').innerHTML=['side','front','three_quarter'].map(v=>'<div>'+({side:'側面',front:'正面',three_quarter:'斜め'}[v])+'</div><div class="strip"><a href="sheets/'+n+'_'+v+'.png"><img alt="'+n+' '+v+'" src="sheets/'+n+'_'+v+'.png"></a></div>').join('');scale()}motion.onchange=view.onchange=show;zoom.oninput=scale;document.querySelector('#restart').onclick=()=>gif.src=gif.src.split('?')[0]+'?t='+Date.now();show();</script></html>
