<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
<title id="title">折り返しで減速することと、同じ位置で待つことの違い</title>
<desc id="desc">上段は滑らかに前後へ折り返す位置の概念曲線。等時間の点は端に近づくほど上下間隔が狭くなる。下段は平らな区間で待ってから急に切り替わる曲線。両者は異なる。実測値ではなく、身体全体が止まることも意味しない。</desc>
<rect width="1120" height="390" fill="white"/>
<g font-family="Noto Sans CJK JP,sans-serif" fill="#222"><text x="36" y="36" font-size="23">折り返しでは減速する。そこで待ち続ける必要はない</text><text x="36" y="64" font-size="15" fill="#666">腕や遊脚の前後位置の概念図。丸い点は等しい時間間隔。実測データではありません。</text>
<text x="36" y="144" font-size="18">滑らかな折り返し</text><text x="36" y="172" font-size="14">端へ近づくほど</text><text x="36" y="194" font-size="14">位置の変化が小さくなる</text>
<text x="36" y="275" font-size="18">待ってから急に切替</text><text x="36" y="301" font-size="14">同じ位置に留まる区間と</text><text x="36" y="323" font-size="14">急な動き出しがある</text></g>
<g stroke="#ddd" fill="none"><path d="M240 159H985M240 291H985M240 95V215M240 230V346"/></g>
