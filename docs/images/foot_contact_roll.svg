<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-labelledby="title desc">
<title id="title">接地する場所が変わり、前足部で曲がって離れる</title><desc id="desc">前方を右とする足の模式図。上段は踵接地、足底の受け入れ、支持脚上の通過、踵上げ、前足部支持、離地後の回収。下段は今回のジョギングで選ぶ前足部側からの接触、踵下降、踵上げ、回収。緑線は接触する場所、丸は指の付け根付近、破線矢印は移動の向き。実測値と力の図ではない。</desc>
<rect width="1240" height="740" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#67756e" stroke-width="1.4"/></marker></defs>
<g font-family="Noto Sans CJK JP,sans-serif" fill="#222"><text x="32" y="37" font-size="24">足裏への接触から、前足部支持・離地へ</text><text x="32" y="67" font-size="15" fill="#666">横からの模式図。前方は右 →。形・順序を説明するための例で、各姿勢の時間間隔は等しくありません。</text>
<text x="32" y="112" font-size="21">歩行：踵から入り、身体が通り、前足部を残して離れる</text></g>
<path d="M18 285H188" stroke="#bbb" stroke-width="1.5"/><g transform="translate(88 282) rotate(-15 -45 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(0 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M42 285H63" stroke="#36735a" stroke-width="6" stroke-linecap="round"/>
<text x="24" y="320" font-family="Noto Sans CJK JP,sans-serif" font-size="17" fill="#333">1 踵が触れる</text>
<text x="24" y="347" font-family="Noto Sans CJK JP,sans-serif" font-size="14" fill="#666">前足部はまだ高い</text>
<path d="M221 285H391" stroke="#bbb" stroke-width="1.5"/><g transform="translate(291 282) rotate(0 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(0 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M250 285H366" stroke="#36735a" stroke-width="6" stroke-linecap="round"/>
<text x="227" y="320" font-family="Noto Sans CJK JP,sans-serif" font-size="17" fill="#333">2 受け入れる</text>
<text x="227" y="347" font-family="Noto Sans CJK JP,sans-serif" font-size="14" fill="#666">前足部が下りる</text>
<path d="M424 285H594" stroke="#bbb" stroke-width="1.5"/><g transform="translate(494 282) rotate(0 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(0 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M453 285H569" stroke="#36735a" stroke-width="6" stroke-linecap="round"/>
<text x="430" y="320" font-family="Noto Sans CJK JP,sans-serif" font-size="17" fill="#333">3 身体が通る</text>
<text x="430" y="347" font-family="Noto Sans CJK JP,sans-serif" font-size="14" fill="#666">支持足の上へ進む</text>
<path d="M627 285H797" stroke="#bbb" stroke-width="1.5"/><g transform="translate(697 282) rotate(24 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(-24 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M735 285H773" stroke="#36735a" stroke-width="6" stroke-linecap="round"/>
<text x="633" y="320" font-family="Noto Sans CJK JP,sans-serif" font-size="17" fill="#333">4 踵が上がる</text>
<text x="633" y="347" font-family="Noto Sans CJK JP,sans-serif" font-size="14" fill="#666">指の付け根で曲がる</text>
<path d="M830 285H1000" stroke="#bbb" stroke-width="1.5"/><g transform="translate(900 282) rotate(43 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(-43 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M938 285H976" stroke="#36735a" stroke-width="6" stroke-linecap="round"/>
<text x="836" y="320" font-family="Noto Sans CJK JP,sans-serif" font-size="17" fill="#333">5 最後の支持</text>
<text x="836" y="347" font-family="Noto Sans CJK JP,sans-serif" font-size="14" fill="#666">前足部から離れる</text>
<path d="M1033 285H1203" stroke="#bbb" stroke-width="1.5"/><g transform="translate(1103 240) rotate(15 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(-8 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M1088 252Q1073 197 1118 167" fill="none" stroke="#67756e" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="1039" y="320" font-family="Noto Sans CJK JP,sans-serif" font-size="17" fill="#333">6 脚を回収する</text>
<text x="1039" y="347" font-family="Noto Sans CJK JP,sans-serif" font-size="14" fill="#666">膝を曲げて前へ</text>
<path d="M32 381H1208" stroke="#ddd"/>
<text x="32" y="421" font-family="Noto Sans CJK JP,sans-serif" font-size="21" fill="#333">今回のジョギング：前足部側がわずかに先行する中足部寄りの例</text>
<path d="M48 579H218" stroke="#bbb" stroke-width="1.5"/><g transform="translate(118 576) rotate(5 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(-5 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M156 579H194" stroke="#36735a" stroke-width="6" stroke-linecap="round"/>
<text x="44" y="615" font-family="Noto Sans CJK JP,sans-serif" font-size="18" fill="#333">1 最初の接触</text>
<text x="44" y="642" font-family="Noto Sans CJK JP,sans-serif" font-size="15" fill="#666">前足部側から</text>
<path d="M352 579H522" stroke="#bbb" stroke-width="1.5"/><g transform="translate(422 576) rotate(0 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(0 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M381 579H497" stroke="#36735a" stroke-width="6" stroke-linecap="round"/>
<text x="348" y="615" font-family="Noto Sans CJK JP,sans-serif" font-size="18" fill="#333">2 受け止める</text>
<text x="348" y="642" font-family="Noto Sans CJK JP,sans-serif" font-size="15" fill="#666">踵が下り、膝も曲がる</text>
<path d="M656 579H826" stroke="#bbb" stroke-width="1.5"/><g transform="translate(726 576) rotate(32 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(-32 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M764 579H802" stroke="#36735a" stroke-width="6" stroke-linecap="round"/>
<text x="652" y="615" font-family="Noto Sans CJK JP,sans-serif" font-size="18" fill="#333">3 押し返して離れる</text>
<text x="652" y="642" font-family="Noto Sans CJK JP,sans-serif" font-size="15" fill="#666">踵上げ・前足部支持</text>
<path d="M960 579H1130" stroke="#bbb" stroke-width="1.5"/><g transform="translate(1030 531) rotate(20 40 0)" stroke="#59615c" stroke-width="4" fill="#f0f1ee" stroke-linecap="round" stroke-linejoin="round"><path d="M-45 -7Q-47 -25 -33 -31L-28 -62L-11 -59L-12 -28Q5 -21 40 -15L40 0L-42 0Z"/><path d="M-22 -61L-35 -116" fill="none" stroke="#b8beb8" stroke-width="7"/><g transform="rotate(-10 40 0)"><path d="M40 -15Q60 -15 76 -7L78 0H40Z"/></g><circle cx="40" cy="0" r="4" fill="#788b82" stroke="white" stroke-width="1.5"/></g><path d="M1015 546Q1000 491 1045 461" fill="none" stroke="#67756e" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="956" y="615" font-family="Noto Sans CJK JP,sans-serif" font-size="18" fill="#333">4 回収から次の接地へ</text>
<text x="956" y="642" font-family="Noto Sans CJK JP,sans-serif" font-size="15" fill="#666">踵を回収し、前へ運ぶ</text>
<text x="32" y="682" font-family="Noto Sans CJK JP,sans-serif" font-size="14" fill="#333">緑：接触する場所の模式表現　丸：指の付け根付近　破線矢印：移動の向き（床反力ではありません）</text>
<text x="32" y="713" font-family="Noto Sans CJK JP,sans-serif" font-size="14" fill="#666">接触順序には個人差があります。参照：本文 [1]・[6]・[15]。本図は独自制作の概念図で、計測図の転載ではありません。</text>
</svg>