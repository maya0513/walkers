<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img" aria-labelledby="title desc">
<title id="title">胴体の三つの向きと、骨盤から胸・肩へ分散する動き</title><desc id="desc">左から骨盤の前後傾斜、左右の傾斜、水平回旋を分けて示す。右の図は骨盤、背骨、胸郭、肩の向きが少しずつ変わる例。どの姿勢も理想角度や固定の位相を示さず、身体を一塊で回す動きとの違いを説明する。</desc>
<rect width="1240" height="590" fill="white"/>
<g font-family="Noto Sans CJK JP,sans-serif" fill="#222"><text x="32" y="38" font-size="24">胴体は一枚の板ではなく、脚から肩へ動きを受け渡す</text><text x="32" y="69" font-size="15" fill="#666">角度を読み分ける模式図。姿勢の変化は見やすく誇張しています。計測値・推奨角度・固定の逆位相を示す図ではありません。</text>
<text x="55" y="126" font-size="19">横から：前後の傾き</text><text x="360" y="126" font-size="19">正面から：左右の傾き</text><text x="695" y="126" font-size="19">上から：水平の回旋</text></g>
