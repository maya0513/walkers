<g font-family="Noto Sans CJK JP,sans-serif" fill="#444" font-size="15"><text x="55" y="461">腰を折る動きと区別する</text><text x="360" y="461">支持脚の切り替わりと見る</text><text x="682" y="461">脚と肩の相対回旋を見る</text>
<text x="948" y="126" font-size="19" fill="#222">骨盤 → 胸郭 → 肩</text><text x="948" y="461">背骨に沿って向きが変わる</text><text x="948" y="488">腰だけをねじらない</text>
<text x="32" y="539">緑：骨盤　青：胸・肩　頭は胴体に無理なくつながる。大きく動かすこと自体を目標にしません。</text><text x="32" y="568" font-size="14" fill="#666">参照：本文 [12] 図2・3のA/B/C、[14] 体幹・肩・腕の協調。独自制作の概念図で、計測姿勢の転載ではありません。</text></g>
</svg>